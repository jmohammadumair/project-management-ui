_schema-version: 3.3.0
ID: project_management
version: 0.0.1
description: "An SAP Fiori application."
parameters:
  enable-parallel-deployments: true
 
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
 
# modules:
#   - name: zvsui_viewer-ui
#     type: html5
#     path: webapp
#     build-parameters:
#       builder: custom
#       commands:
#         - npm install
#         - npm run build
 
modules:
  - name: project_management-ui
    type: html5
    path: webapp
    parameters:
      buildpack: staticfile_buildpack
      random-route: true
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build

  - name: project_management-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 256M
      disk-quota: 256M
    properties:
      destinations: >
        [
          {
            "name": "project-management-capm",
            "url": "https://ed5141e1trial-dev-project-management-capm-srv.cfapps.us10-001.hana.ondemand.com",
            "forwardAuthToken": false
          },
          {
            "name": "project-management-ui",
            "url": "https://d283a1e6trial-dev-project-management-ui.cfapps.us10-001.hana.ondemand.com",
            "forwardAuthToken": false
          }
        ]

resources: []